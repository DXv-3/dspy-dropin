[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspy-dropin"
version = "0.1.0"
description = "Drop-in, zero-setup wrapper around DSPy: one-liners, @program decorator, optimizers, CLI, HTTP server and GitHub Action."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DXv-3" }]
dependencies = ["dspy>=3.0"]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
dspy-dropin = "dspy_dropin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_dropin"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
