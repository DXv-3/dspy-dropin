name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[server,dev]" httpx
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: CLI smoke (offline dummy LM)
        env:
          DSPY_MODEL: dummy
        run: |
          dspy-dropin doctor --ping
          dspy-dropin ask "ping?"
          dspy-dropin run "text -> summary" -i text="hello world"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dropin
        uses: ./
        with:
          signature: "question -> answer"
          inputs: '{"question": "What is DSPy?"}'
          model: dummy
          version: ${{ github.sha }}
      - run: echo '${{ steps.dropin.outputs.result }}'
