name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[server,dev]" httpx
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Server smoke (bind default, auth enforced, body cap)
        env:
          DSPY_MODEL: dummy
          DSPY_DROPIN_TOKEN: ci-token-0123456789abcdef
          DSPY_DROPIN_MAX_BODY: "2048"
        run: |
          dspy-dropin serve --backend stdlib --port 39801 & pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:39801/health >/dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:39801/ask -d '{"prompt":"x"}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DSPY_DROPIN_TOKEN" http://127.0.0.1:39801/ask -d '{"prompt":"x"}')" = 200
          head -c 5000 /dev/zero | tr '\0' a > big.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DSPY_DROPIN_TOKEN" http://127.0.0.1:39801/ask --data-binary @big.txt)" = 413
          kill $pid
      - name: CLI smoke (offline dummy LM)
        env:
          DSPY_MODEL: dummy
        run: |
          dspy-dropin doctor --ping
          dspy-dropin ask "ping?"
          dspy-dropin run "text -> summary" -i text="hello world"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dropin
        uses: ./
        with:
          signature: "question -> answer"
          inputs: '{"question": "What is DSPy?"}'
          model: dummy
          version: ${{ github.sha }}
      - name: Show result (via env, never interpolated into the script)
        env:
          RESULT: ${{ steps.dropin.outputs.result }}
        run: |
          printf '%s\n' "$RESULT"
          test -n "$RESULT"
